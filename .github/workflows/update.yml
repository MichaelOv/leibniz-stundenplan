name: Update timetable
on:
  workflow_dispatch:
concurrency:
  group: timetable-update
  cancel-in-progress: false
jobs:
  refresh:
    # Ferien-Pause: Job stillgelegt, damit keine fehlschlagenden Laeufe/Mails
    # entstehen (kein Vertretungsplan in den Ferien). Zum Reaktivieren diese
    # 'if: false'-Zeile entfernen.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/run_all.py
        env:
          ISERV_USER: ${{ secrets.ISERV_USER }}
          ISERV_PASS: ${{ secrets.ISERV_PASS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Automated timetable refresh'
          file_pattern: 'data/*.json data/last_ntfy_hash_*.txt'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
