name: Update timetable

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 pymupdf
      - run: python scripts/fetch_and_build.py
      - run: |
          cp vertretungsplan-dashboard.html index.html
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Automated timetable refresh'
