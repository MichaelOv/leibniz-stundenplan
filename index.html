<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stundenplan 6C - Leibniz-Gymnasium GE</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=cabinet-grotesk@500,700&display=swap" rel="stylesheet">
  <style>
    :root,[data-theme="light"]{
      --text-xs:clamp(.75rem,.7rem + .25vw,.875rem);--text-sm:clamp(.875rem,.8rem + .35vw,1rem);--text-base:clamp(1rem,.95rem + .25vw,1.125rem);--text-lg:clamp(1.125rem,1rem + .75vw,1.5rem);--text-xl:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
      --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;--space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;
      --color-bg:#f7f6f2;--color-surface:#f9f8f5;--color-surface-2:#fbfbf9;--color-border:#d4d1ca;--color-text:#28251d;--color-text-muted:#6f6d67;--color-primary:#01696f;--color-primary-highlight:#cedcd8;--color-success:#437a22;--color-warning:#964219;--color-frei:#8b1a1a;--radius-md:.75rem;--radius-lg:1rem;--shadow-sm:0 1px 2px rgba(0,0,0,.05);--font-body:'Satoshi',system-ui,sans-serif;--font-display:'Cabinet Grotesk',system-ui,sans-serif;
    }
    [data-theme="dark"]{
      --color-bg:#171614;--color-surface:#1c1b19;--color-surface-2:#201f1d;--color-border:#393836;--color-text:#cdccca;--color-text-muted:#9d9b97;--color-primary:#4f98a3;--color-primary-highlight:#313b3b;--color-success:#6daa45;--color-warning:#bb653b;--color-frei:#c0392b;--shadow-sm:0 1px 2px rgba(0,0,0,.2);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:var(--font-body);background:var(--color-bg);color:var(--color-text);line-height:1.55}
    a{color:inherit} button{font:inherit;cursor:pointer;border:none;background:none}
    .shell{max-width:860px;margin:0 auto;padding:var(--space-4)}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:var(--space-4);padding:var(--space-4) 0}
    .brand{display:flex;align-items:center;gap:var(--space-3)}
    .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--color-primary),transparent 80%),var(--color-surface-2);display:grid;place-items:center;box-shadow:var(--shadow-sm)}
    .brand h1{font-family:var(--font-display);font-size:var(--text-xl);line-height:1}
    .brand p{color:var(--color-text-muted);font-size:var(--text-sm)}
    .actions{display:flex;gap:var(--space-2)}
    .btn{
      padding:.6rem 1rem;
      border-radius:999px;
      border:1px solid var(--color-border);
      background:var(--color-surface);
      color:var(--color-text);
      min-height:44px;
      font-size:var(--text-sm);
    }
    .btn:hover{
      background:var(--color-surface-2);
    }
    .hero{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--space-4);margin-top:var(--space-4)}
    .card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
    .stat{padding:var(--space-5)}
    .stat span{display:block;color:var(--color-text-muted);font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.06em;margin-bottom:var(--space-2)}
    .stat strong{font-family:var(--font-display);font-size:1.9rem;line-height:1}
    .stat p{font-size:var(--text-sm);color:var(--color-text-muted);margin-top:var(--space-1)}
    .plan-card{margin-top:var(--space-4);padding:var(--space-5)}
    .plan-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-5)}
    .plan-header h2{font-family:var(--font-display);font-size:var(--text-lg)}
    .pill{display:inline-flex;gap:.45rem;align-items:center;background:var(--color-primary-highlight);color:var(--color-primary);padding:.35rem .7rem;border-radius:999px;font-size:var(--text-xs);font-weight:700;letter-spacing:.02em}
    table{width:100%;border-collapse:collapse;font-size:var(--text-sm)}
    th,td{padding:.75rem var(--space-3);border-bottom:1px solid var(--color-border);text-align:left;vertical-align:middle}
    th{font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--color-text-muted);font-weight:500}
    tr:last-child td{border-bottom:none}
    tr.row-frei td{color:var(--color-text-muted)}
    tr.row-frei td:first-child{color:var(--color-text)}
    .tag{display:inline-flex;padding:.25rem .55rem;border-radius:999px;font-size:var(--text-xs);font-weight:700}
    .tag.normal{background:rgba(67,122,34,.1);color:var(--color-success)}
    .tag.vertretung{background:rgba(150,66,25,.12);color:var(--color-warning)}
    .tag.frei{background:rgba(139,26,26,.1);color:var(--color-frei)}
    .tag.info{background:rgba(0,0,0,.06);color:var(--color-text-muted)}
    .hinweis{font-size:var(--text-xs);color:var(--color-text-muted);margin-top:.2rem}
    .vtg-name{font-size:var(--text-xs);color:var(--color-warning);margin-top:.2rem}
    .fach-strike{text-decoration:line-through;opacity:.45}
    .empty{padding:var(--space-8);text-align:center;color:var(--color-text-muted)}
    .error-box{background:rgba(139,26,26,.08);border:1px solid rgba(139,26,26,.2);border-radius:var(--radius-md);padding:var(--space-4);color:var(--color-frei);font-size:var(--text-sm);margin-top:var(--space-4)}
    .footer{margin:var(--space-8) 0 var(--space-4);font-size:var(--text-xs);color:var(--color-text-muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:var(--space-2)}
    @media(max-width:640px){.hero{grid-template-columns:1fr 1fr}.hero .stat:last-child{grid-column:1/-1}.plan-header{flex-direction:column;align-items:flex-start;gap:var(--space-2)}.topbar{flex-wrap:wrap}.brand h1{font-size:var(--text-lg)}}
    @media(max-width:400px){.hero{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 5h9l5 5v9H5z"/><path d="M14 5v5h5"/><path d="M8 14h8M8 18h5"/></svg>
      </div>
      <div>
        <h1>Stundenplan 6C</h1>
        <p>Leibniz-Gymnasium GE</p>
      </div>
    </div>
    <div class="actions">
      <div style="display:flex;gap:4px;background:var(--color-surface);border-radius:8px;padding:3px">
        <button class="btn" id="todayBtn" onclick="switchDay('today')" style="opacity:1">Tag</button>
        <button class="btn" id="tomorrowBtn" onclick="switchDay('tomorrow')" style="opacity:.5">Tag</button>
      </div>
      <a id="ntfyBtn" href="#" target="_blank" rel="noopener" class="btn" style="display:none">ntfy abonnieren</a>
      <button class="btn" data-theme-toggle aria-label="Theme wechseln">&#9680;</button>
    </div>
  </header>

  <div class="hero">
    <div class="card stat">
      <span>Tag</span>
      <strong id="statDay">&#8212;</strong>
      <p id="statDate">Lade...</p>
    </div>
    <div class="card stat">
      <span>Stunden heute</span>
      <strong id="statCount">&#8212;</strong>
      <p>Klasse 6C</p>
    </div>
    <div class="card stat">
      <span>&#196;nderungen</span>
      <strong id="statVtg">&#8212;</strong>
      <p id="statGenerated">&#8212;</p>
    </div>
  </div>

  <div id="errorBox" style="display:none" class="error-box"></div>

  <div class="card plan-card">
    <div class="plan-header">
      <h2>Tagesplan</h2>
      <span class="pill" id="statusPill">Lade...</span>
    </div>
    <table>
      <thead>
        <tr>
          <th>Std</th>
          <th>Fach</th>
          <th>Lehrkraft</th>
          <th>Raum</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="planBody">
        <tr><td colspan="5" class="empty">Daten werden geladen&#8230;</td></tr>
      </tbody>
    </table>
  </div>

  <footer class="footer">
    <span>PlanFlow 6C &middot; Leibniz-Gymnasium</span>
    <span id="footerGenerated"></span>
  </footer>
</div>

<script>
(function(){
  const toggle = document.querySelector('[data-theme-toggle]');
  let theme = localStorage.getItem('theme') ||
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
  toggle.addEventListener('click', () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
  });

  let currentDay = 'today';

  window.switchDay = function(day) {
    currentDay = day;
    document.getElementById('todayBtn').style.opacity = day === 'today' ? '1' : '.5';
    document.getElementById('tomorrowBtn').style.opacity = day === 'tomorrow' ? '1' : '.5';
    load();
  }

  async function load() {
    const errorBox = document.getElementById('errorBox');
    errorBox.style.display = 'none';
    document.getElementById('statusPill').textContent = 'Lade...';
    try {
      const file = currentDay === 'tomorrow' ? 'tomorrow_6c.json' : 'today_6c.json';
      const r = await fetch('data/' + file + '?t=' + Date.now());
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      render(d);
    } catch(e) {
      errorBox.textContent = 'Fehler beim Laden: ' + e.message + ' \u2014 Ist server.py gestartet?';
      errorBox.style.display = 'block';
      document.getElementById('statusPill').textContent = 'Fehler';
      document.getElementById('planBody').innerHTML =
        '<tr><td colspan="5" class="empty">Keine Daten verf\u00fcgbar.</td></tr>';
    }
  }

  function render(d) {
    document.getElementById('statDay').textContent   = d.day || '\u2014';
    if (currentDay === 'today') {
      document.getElementById('todayBtn').textContent = d.day || 'Heute';
    } else {
      document.getElementById('tomorrowBtn').textContent = d.day || 'Morgen';
    }
    document.getElementById('statDate').textContent  = formatDate(d.date);
    document.getElementById('statCount').textContent = d.plan ? new Set(d.plan.map(p => p.stunde)).size : 0;
    document.getElementById('statVtg').textContent   = d.vtg_count || 0;

    const standSrc = d.pdf_stand || d.generated_at;
    const gen = standSrc ? new Date(standSrc) : null;
    const genStr = gen ? gen.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'}) : '\u2014';
    document.getElementById('statGenerated').textContent = 'Stand ' + genStr + ' Uhr';

    const runSrc = d.generated_at;
    const runGen = runSrc ? new Date(runSrc) : null;
    const runStr = runGen ? runGen.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'}) : '\u2014';
    document.getElementById('footerGenerated').textContent = 'Zuletzt gepr\u00fcft: ' + runStr + ' Uhr';

    const pill = document.getElementById('statusPill');
    if (!d.vtg_count || d.vtg_count === 0) {
      pill.textContent = 'Kein Ausfall';
      pill.style.cssText = '';
    } else {
      pill.textContent = d.vtg_count + ' \u00c4nderung' + (d.vtg_count > 1 ? 'en' : '');
      pill.style.background = 'rgba(150,66,25,.14)';
      pill.style.color = 'var(--color-warning)';
    }

    const tbody = document.getElementById('planBody');
    if (!d.plan || d.plan.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty">Keine Eintr\u00e4ge f\u00fcr diesen Tag.</td></tr>';
      return;
    }

    tbody.innerHTML = d.plan.map(p => {
      const labels = {normal:'Regul\u00e4r', vertretung:'Vertretung', frei:'F\u00e4llt aus', info:'Info'};
      const tagLabel = labels[p.status] || p.status;
      const vtgLine  = p.vertreter ? '<div class="vtg-name">\u2192 ' + esc(p.vertreter) + '</div>' : '';
      const hinweis  = p.hinweis   ? '<div class="hinweis">' + esc(p.hinweis) + '</div>' : '';
      const fachCell = p.status === 'frei'
        ? '<span class="fach-strike">' + esc(p.fach) + '</span>'
        : esc(p.fach);
      const zeit = ZEITEN[p.stunde] ? '<div style="font-size:.75em;opacity:.6">' + ZEITEN[p.stunde] + '</div>' : '';
      return '<tr class="row-' + p.status + '">'
        + '<td><strong>' + p.stunde + '</strong>' + zeit + '</td>'
        + '<td>' + fachCell + '</td>'
        + '<td>' + esc(p.lehrer) + vtgLine + '</td>'
        + '<td>' + esc(p.raum) + '</td>'
        + '<td><span class="tag ' + p.status + '">' + tagLabel + '</span>' + hinweis + '</td>'
        + '</tr>';
    }).join('');
  }

  function formatDate(iso) {
    if (!iso) return '';
    return new Date(iso + 'T00:00:00').toLocaleDateString('de-DE',
      {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  }

  const ZEITEN = {
    1: '8:20 – 9:05',
    2: '9:10 – 9:55',
    3: '10:15 – 11:00',
    4: '11:05 – 11:50',
    5: '12:05 – 12:50',
    6: '12:55 – 13:40',
    7: '13:50 – 14:35',
    8: '14:40 – 15:25',
    9: '15:25 – 16:10'
  };

  function esc(s) {
    if (!s) return '\u2014';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ntfy Subscribe-Button laden
  (async () => {
    try {
      const r = await fetch('data/config.json?t=' + Date.now());
      const c = await r.json();
      if (c.ntfy_topic) {
        const btn = document.getElementById('ntfyBtn');
        btn.href = 'https://ntfy.sh/' + c.ntfy_topic;
        btn.style.display = '';
      }
      if (c.last_run_at) {
        const run = new Date(c.last_run_at);
        const runStr = run.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
        document.getElementById('footerGenerated').textContent = 'Zuletzt geprüft: ' + runStr + ' Uhr';
      }
    } catch(e) {}
  })();

  // Beide Tagnamen vorab laden
  (async () => {
    try {
      const rt = await fetch('data/today_6c.json?t=' + Date.now());
      const dt = await rt.json();
      document.getElementById('todayBtn').textContent = dt.day || 'Tag 1';
    } catch(e) {}
    try {
      const rm = await fetch('data/tomorrow_6c.json?t=' + Date.now());
      const dm = await rm.json();
      document.getElementById('tomorrowBtn').textContent = dm.day || 'Tag 2';
    } catch(e) {}
  })();
  load();
  setInterval(load, 5 * 60 * 1000);
})();
</script>
</body>
</html>
