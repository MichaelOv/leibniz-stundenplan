name: Update timetable
on:
  schedule:
    # Morgens alle 5 Minuten (4:30-6:55 UTC = 6:30-8:55 MESZ)
    - cron: '30,35,40,45,50,55 4 * * 1-5'
    - cron: '*/5 5-6 * * 1-5'
    # Stündlich (7:00-20:00 UTC = 9:00-22:00 MESZ)
    - cron: '0 7-20 * * 1-5'
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/run_all.py
        env:
          ISERV_USER: ${{ secrets.ISERV_USER }}
          ISERV_PASS: ${{ secrets.ISERV_PASS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Automated timetable refresh'
          file_pattern: 'data/*.json'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
