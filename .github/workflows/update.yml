name: Update timetable
on:
  workflow_dispatch:
concurrency:
  group: timetable-update
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Ferien-Pause bis Ferienende: vor dem 2026-09-02 wird der Lauf
      # uebersprungen (in den Ferien gibt es keinen Vertretungsplan, sonst
      # nur Failure-Mails). Ab dem 2026-09-02 laeuft alles automatisch wieder.
      - name: Ferien-Gate
        id: gate
        run: |
          if [[ "$(date -u +%F)" < "2026-09-02" ]]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Ferien-Pause bis 2026-09-02 - Lauf uebersprungen."
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.active == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.active == 'true'
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.active == 'true'
      - run: python scripts/run_all.py
        if: steps.gate.outputs.active == 'true'
        env:
          ISERV_USER: ${{ secrets.ISERV_USER }}
          ISERV_PASS: ${{ secrets.ISERV_PASS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        if: steps.gate.outputs.active == 'true'
        with:
          commit_message: 'Automated timetable refresh'
          file_pattern: 'data/*.json data/last_ntfy_hash_*.txt'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
